<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área Administrativa — MS Consultoria</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <style>
    .placeholder { min-height: 100vh; display: grid; place-items: center; text-align: center; background: var(--green-950); color: #fff; padding: 40px 20px; }
    .placeholder__inner { max-width: 520px; }
    .placeholder .brand__shield { margin-inline: auto; margin-bottom: 20px; background: var(--green-700); color: var(--green-100); }
    .placeholder h1 { color: #fff; font-size: 2rem; margin-bottom: 12px; }
    .placeholder p { color: rgba(255,255,255,0.7); margin-bottom: 28px; }
    .placeholder .badge { display: inline-block; padding: 8px 18px; border-radius: var(--radius-pill); background: rgba(255,255,255,0.12); color: var(--green-200); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 20px; }
  </style>
</head>
<body>
  <main class="placeholder">
    <div class="placeholder__inner">
      <span class="brand__shield" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="40" height="40"><path d="M16 2 4 7v8c0 7 5 13 12 15 7-2 12-8 12-15V7L16 2z" fill="currentColor"/><path d="M16 7l-6.5 3v5.5c0 4.6 2.8 8.6 6.5 10 3.7-1.4 6.5-5.4 6.5-10V10L16 7z" fill="#fff"/></svg>
      </span>
      <span class="badge">Restrito</span>
      <h1>Área Administrativa MS</h1>
      <p>Painel interno da MS Consultoria. Reservado para uso administrativo da equipe.</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn--primary" href="../sistema/">Ver demonstração do sistema ↗</a>
        <a class="btn btn--whatsapp" href="../index.html">← Voltar ao site institucional</a>
      </div>
    </div>
  </main>
</body>
</html>
